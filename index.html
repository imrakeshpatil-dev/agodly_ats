<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agodly ATS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9Oer+R5W90n2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout container-fluid p-0 is-auth-locked" id="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="brand-wrap">
            <div class="brand-mark">A</div>
            <p class="brand-name">Agodly ATS</p>
          </div>
          <button class="ghost-icon" id="sidebarToggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">&lt;</button>
        </div>

        <div class="nav-group">
          <p class="group-title">Recruiting</p>
          <button class="nav-btn is-active" data-section="dashboard" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8v-8h-8zM3 21h8v-6H3zm10-10h8V3h-8z"/></svg></span><span class="nav-label">Dashboard</span></button>
          <button class="nav-btn" data-section="candidates" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.8 0-5 1.5-5 3.5V19h10v-2.5c0-2-2.2-3.5-5-3.5zm8 0c-.7 0-1.4.1-2 .3A5.7 5.7 0 0 1 18 19h3v-2c0-2.2-2.2-4-5-4z"/></svg></span><span class="nav-label">Candidates</span></button>
          <button class="nav-btn" data-section="candidate-pool" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg></span><span class="nav-label">Candidate Pool</span></button>
          <button class="nav-btn" data-section="clients" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19h16v2H4zM6 17V7l6-3 6 3v10h-2V8.3l-4-2-4 2V17z"/></svg></span><span class="nav-label">Clients</span></button>
          <button class="nav-btn" data-section="jobs" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5V3h6v2h5v14H4V5zm2 0h2V4h-2zm-5 4v8h12V9z"/></svg></span><span class="nav-label">Jobs</span></button>
          <button class="nav-btn" data-section="ai-match" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 4.8L19 9l-4.8 2.2L12 16l-2.2-4.8L5 9l4.8-2.2zM5 16l1.2 2.8L9 20l-2.8 1.2L5 24l-1.2-2.8L1 20l2.8-1.2zM19 14l1.2 2.8L23 18l-2.8 1.2L19 22l-1.2-2.8L15 18l2.8-1.2z"/></svg></span><span class="nav-label">MY LLM</span></button>
          <button class="nav-btn" data-section="pipeline" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h6v4H4zm10 0h6v4h-6zM9 18h6v-4H9zM10 7h4v2h-4zm7 2h2v3h-2zm-12 0h2v3H5zm6 3h2v2h-2z"/></svg></span><span class="nav-label">Pipeline</span></button>
          <button class="nav-btn" data-section="interviews" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4zm11 6H6v12h12zM8 12h8v2H8zm0 4h5v2H8z"/></svg></span><span class="nav-label">Interviews</span></button>
          <button class="nav-btn" data-section="messages" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm1 4v2h14V7zm0 4v2h10v-2z"/></svg></span><span class="nav-label">Messages</span><span id="messageNavBadge" class="nav-count" hidden></span></button>
        </div>

        <div class="nav-group">
          <p class="group-title">Bulk Processing</p>
          <button class="nav-btn" data-section="bulk-upload" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l5 5h-3v6h-4V8H7zM4 18h16v3H4z"/></svg></span><span class="nav-label">Bulk Upload</span></button>
        </div>

        <div class="nav-group">
          <p class="group-title">Operations</p>
          <button class="nav-btn" data-section="users" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.3 0-6 1.8-6 4v2h12v-2c0-2.2-2.7-4-6-4z"/></svg></span><span class="nav-label">Users</span></button>
          <button class="nav-btn" data-section="team-dashboard" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 20h18v-2H3zm2-4h3V9H5zm5 0h3V4h-3zm5 0h3v-6h-3zM4 7l4-4 4 4 4-4 4 4v3h-2V7.8l-2-2-4 4-4-4-4 4V7z"/></svg></span><span class="nav-label">Team Dashboard</span></button>
          <button class="nav-btn" data-section="diagnostics" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zm2 6h12v10H6zm2 2v2h8v-2zm0 4v2h5v-2z"/></svg></span><span class="nav-label">Diagnostics</span></button>
        </div>

        <div class="nav-group">
          <p class="group-title">Analytics</p>
          <button class="nav-btn" data-section="revenue" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 6a4 4 0 0 0-4-2H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H9a4 4 0 0 1-4-2"/></svg></span><span class="nav-label">Revenue</span></button>
          <button class="nav-btn" data-section="recruiter-performance" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-7 9c.4-3.4 3.3-6 7-6s6.6 2.6 7 6zM19 4h2v7h-2zm0 9h2v2h-2z"/></svg></span><span class="nav-label">Recruiter Performance</span></button>
          <button class="nav-btn" data-section="leaderboard" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 22h16v-2H4zM6 18h3V9H6zm5 0h3V4h-3zm5 0h3v-7h-3z"/></svg></span><span class="nav-label">Leaderboard</span></button>
          <button class="nav-btn" data-section="activity-log" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7v6l4 2M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/></svg></span><span class="nav-label">Activity Log</span></button>
        </div>

        <div class="user-card">
          <p class="user-name" id="currentUserName">MD User</p>
          <p class="user-email" id="currentUserEmail">Sign in required</p>
          <div class="user-actions">
            <button id="changePasswordBtn" type="button">Change Password</button>
            <button id="logoutBtn" type="button">Logout</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="toolbar d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="toolbar-left d-flex align-items-center gap-3">
            <button class="ghost-icon" id="mobileMenuBtn" type="button" aria-label="Open navigation menu" title="Open navigation menu">=</button>
            <h1 id="pageTitle">Dashboard</h1>
          </div>

          <div class="toolbar-right d-flex flex-wrap align-items-center justify-content-end gap-2">
            <button id="messageQuickAccess" class="notification-bell message-quick-access" type="button" aria-label="Open team messages" title="Team messages"><span aria-hidden="true">💬</span><strong hidden></strong></button>
            <div id="notificationCenter" class="notification-center" aria-label="Candidate review notifications"></div>
            <input id="searchInput" type="search" placeholder="Search candidates, jobs, clients" />
            <select id="densityControl" aria-label="Workspace density">
              <option value="comfortable">Comfortable view</option>
              <option value="compact">Compact view</option>
            </select>
            <select id="periodFilter">
              <option value="all">All Time</option>
              <option value="current-month">Current Month</option>
            </select>
            <button id="newRecordBtn" class="tool-btn" type="button">New</button>
          </div>
        </header>

        <section class="api-strip">
          <div class="api-info">
            <span class="api-dot" id="apiDot"></span>
            <p id="apiStatus">Checking backend...</p>
            <span id="apiBaseText"></span>
          </div>
          <p class="usage-info">Total candidates: <strong id="usageCandidates">0</strong></p>
        </section>

        <section class="section-container" id="sectionContainer"></section>
      </main>
    </div>

    <div id="authRoot"></div>
    <div id="modalRoot"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
