services:
  - type: web
    name: agodly-ats
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /ready
    autoDeploy: true
    # Persistent disk so the SQLite database survives deploys/restarts.
    disk:
      name: agodly-data
      mountPath: /var/lib/agodly-ats
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AGODLY_DATA_DIR
        value: /var/lib/agodly-ats
      - key: DATABASE_URL
        value: file:/var/lib/agodly-ats/agodly-ats.sqlite
      - key: ADMIN_EMAIL
        value: admin@agodly.com
      # Set these as secret env vars in the Render dashboard (do not commit real values):
      #   ADMIN_PASSWORD, AUTH_TOKEN_SECRET, OPENAI_API_KEY
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
