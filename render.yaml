services:
  - type: web
    name: agodly-ats
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /ready
    autoDeploy: true
    # Persistent disk so the SQLite database survives deploys/restarts.
    disk:
      name: agodly-data
      mountPath: /var/lib/agodly-ats
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AGODLY_DATA_DIR
        value: /var/lib/agodly-ats
      - key: DATABASE_URL
        value: file:/var/lib/agodly-ats/agodly-ats.sqlite
      - key: ADMIN_EMAIL
        value: admin@agodly.com
      # Set these as secret env vars in the Render dashboard (do not commit real values):
      #   ADMIN_PASSWORD, AUTH_TOKEN_SECRET, OPENAI_API_KEY
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_BULK_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_STANDARD_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_COMPLEX_MODEL
        value: gpt-5.6-terra
      - key: AI_REQUEST_TIMEOUT_MS
        value: 30000
      - key: AI_MAX_RETRIES
        value: 1
      - key: AI_MAX_OUTPUT_TOKENS
        value: 2000
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
