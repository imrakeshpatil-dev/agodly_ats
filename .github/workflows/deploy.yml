name: Deploy to Vultr (CloudPanel)

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only audit or approved deployment
        required: true
        default: audit
        type: choice
        options:
          - audit
          - deploy

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use production Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate types, Prisma schema, tests, and production build
        run: npm run release:check

  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'audit'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect production architecture without changing it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd ~/htdocs/admin.agodly.com
            set -a
            . ./.env
            set +a
            echo "OS=$(awk -F= '/^PRETTY_NAME=/{gsub(/^\"|\"$/, "", $2); print $2}' /etc/os-release)"
            echo "HOST=$(hostname)"
            echo "APP_DIR=$(pwd)"
            echo "GIT_BRANCH=$(git branch --show-current)"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "NODE_VERSION=$(node --version)"
            echo "PM2_PROCESS=agodly-ats"
            pm2 status agodly-ats
            echo "DATABASE_PATH=${DATABASE_URL#file:}"
            echo "DATA_DIR=$AGODLY_DATA_DIR"
            echo "RESUME_DIR=$AGODLY_DATA_DIR/resumes"
            echo "ENV_PERMISSIONS=$(stat -c '%A' .env 2>/dev/null || stat -f '%Sp' .env)"
            echo "DATABASE_BYTES=$(wc -c < "${DATABASE_URL#file:}")"
            echo "RESUME_FILES=$(find "$AGODLY_DATA_DIR/resumes" -type f | wc -l)"
            echo "RESUME_BYTES=$(du -sb "$AGODLY_DATA_DIR/resumes" 2>/dev/null | awk '{print $1}' || du -sk "$AGODLY_DATA_DIR/resumes" | awk '{print $1 * 1024}')"
            node -e 'const D=require("better-sqlite3"),db=new D(String(process.env.DATABASE_URL||"").replace(/^file:/,""),{readonly:true,fileMustExist:true}),read=k=>{const r=db.prepare("SELECT value FROM RuntimeState WHERE key = ?").get(k);return r?JSON.parse(Buffer.isBuffer(r.value)?r.value.toString("utf8"):String(r.value)):{}},c=read("candidate-store").candidates||[],a=read("app-state");console.log("CANDIDATE_COUNT="+c.filter(x=>x.status!=="DELETED").length);console.log("JOB_COUNT="+(Array.isArray(a.jobs)?a.jobs.length:0));console.log("CLIENT_COUNT="+(Array.isArray(a.clients)?a.clients.length:0));db.close()'
            if command -v nginx >/dev/null 2>&1; then
              echo "NGINX_STATUS=$(systemctl is-active nginx 2>/dev/null || true)"
              nginx -T 2>/dev/null | awk '/server_name admin\.agodly\.com|proxy_pass|ssl_certificate /{print "NGINX=" $0}' | head -20
            fi
            curl -fsS http://127.0.0.1:3000/ready

  backup:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create verified production backups before deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd ~/htdocs/admin.agodly.com
            set -a
            . ./.env
            set +a
            umask 077
            timestamp=$(date -u +%Y%m%dT%H%M%SZ)
            release_root="$AGODLY_DATA_DIR/release-backups"
            release_dir="$release_root/$timestamp"
            mkdir -p "$release_dir"
            git rev-parse HEAD > "$release_dir/git-commit.txt"
            git branch --show-current > "$release_dir/git-branch.txt"
            cp .env "$release_dir/application.env"
            chmod 600 "$release_dir/application.env"
            npm run db:backup -- --require-existing
            test -d "$AGODLY_DATA_DIR/resumes"
            tar -czf "$release_dir/resumes.tar.gz" -C "$AGODLY_DATA_DIR" resumes
            tar -tzf "$release_dir/resumes.tar.gz" >/dev/null
            test -s "$release_dir/resumes.tar.gz"
            node -e 'const D=require("better-sqlite3"),db=new D(String(process.env.DATABASE_URL||"").replace(/^file:/,""),{readonly:true,fileMustExist:true}),read=k=>{const r=db.prepare("SELECT value FROM RuntimeState WHERE key = ?").get(k);return r?JSON.parse(Buffer.isBuffer(r.value)?r.value.toString("utf8"):String(r.value)):{}},c=read("candidate-store").candidates||[],a=read("app-state");console.log(JSON.stringify({activeCandidates:c.filter(x=>x.status!=="DELETED").length,totalCandidates:c.length,jobs:Array.isArray(a.jobs)?a.jobs.length:0,clients:Array.isArray(a.clients)?a.clients.length:0,capturedAt:new Date().toISOString()},null,2));db.close()' > "$release_dir/data-counts.json"
            if command -v nginx >/dev/null 2>&1 && nginx -T > "$release_dir/nginx-config.txt" 2>&1; then
              chmod 600 "$release_dir/nginx-config.txt"
            else
              rm -f "$release_dir/nginx-config.txt"
            fi
            sha256sum "$release_dir"/* > "$release_dir/SHA256SUMS"
            printf '%s\n' "$timestamp" > "$release_root/LATEST"
            echo "Verified release backup created: $release_dir"

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH using the existing PM2 process
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd ~/htdocs/admin.agodly.com
            chmod 600 .env
            echo ">> Pulling approved main commit..."
            git fetch origin main
            git reset --hard origin/main
            echo ">> Installing locked dependencies..."
            npm ci
            echo ">> Building..."
            npm run build
            echo ">> Applying additive database migrations..."
            npm run prisma:migrate:deploy
            echo ">> Restarting only agodly-ats..."
            pm2 restart agodly-ats
            pm2 save
            echo ">> Waiting for readiness..."
            sleep 3
            curl -fsS http://127.0.0.1:3000/ready
            echo ""
            echo "Deploy OK: $(git rev-parse HEAD)"
